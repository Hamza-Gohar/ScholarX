[project]
name = "scholarx-backend"
version = "0.1.0"
description = "Autonomous Scholarship Intelligence Network for Pakistani Students"
readme = "../Agents.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "google-genai>=0.1.1",
    "groq>=0.9.0",
    "tavily-python>=0.5.0",
    "firecrawl-py>=1.0.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
