<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarX — Minimalist Korean Pitch Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-ivory: #F8F6F2;
      --text-dark: #1F1F1F;
      --text-mocha: #7D6652;
      --text-body: #3E3E3E;
      --text-muted: #6A6A6A;
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: #E8E2DA;
      --contour-line: #C48D80;
      --font-main: 'Plus Jakarta Sans', Arial, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: #121212;
      color: var(--text-dark);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Presentation Container (16:9 Aspect Ratio) */
    #deck-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slide-viewport {
      width: min(94vw, 167.1vh);
      height: min(52.88vw, 94vh);
      background-color: var(--bg-ivory);
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }

    /* Background Vector SVG (Korean Blobs & Contour Lines) */
    .bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Slide Content Surface */
    .slide-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 5% 7%;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.35s ease-in-out;
    }

    .slide-content.active {
      display: flex;
      opacity: 1;
    }

    /* Standard Header */
    .slide-header {
      margin-bottom: 24px;
    }

    .category-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-mocha);
      margin-bottom: 6px;
    }

    .slide-title {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .title-dark {
      color: var(--text-dark);
    }

    .title-accent {
      color: var(--text-mocha);
    }

    .slide-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.4;
    }

    /* Pebble Badges */
    .pebble-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 14px;
      border-radius: 46% 54% 50% 50% / 48% 52% 48% 52%;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .pebble-01 { background-color: #DDE2D8; color: #465042; }
    .pebble-02 { background-color: #F5E5E0; color: #7A4C46; }
    .pebble-03 { background-color: #EAE6E0; color: #57544F; }
    .pebble-04 { background-color: #F0EAE1; color: #6E6252; }
    .pebble-05 { background-color: #EDE0D4; color: #6D5344; }
    .pebble-06 { background-color: #E1E6E8; color: #475960; }

    /* Cards */
    .korean-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }

    /* Slide 1: Hero Cover */
    .hero-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-title-area {
      margin-top: 4vh;
    }

    .hero-huge-title {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 16px;
    }

    .hero-desc {
      font-size: 1.25rem;
      color: var(--text-body);
      max-width: 800px;
      line-height: 1.5;
    }

    .hero-highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: auto;
      margin-bottom: 2vh;
    }

    /* Slide 2 & 3: Concept Split */
    .concept-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 28px;
      flex: 1;
      align-items: stretch;
    }

    .definition-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px;
    }

    .definition-headline {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .definition-text {
      font-size: 0.95rem;
      color: var(--text-body);
      line-height: 1.6;
    }

    .pillars-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .pillar-card {
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .pillar-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .pillar-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Slide 4: Comparison Matrix */
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 18px;
    }

    .comp-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .comp-badge {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 6px;
    }

    .comp-subtitle {
      font-size: 0.8rem;
      color: var(--text-mocha);
      font-weight: 600;
    }

    .comp-list {
      list-style: none;
    }

    .comp-list li {
      font-size: 0.85rem;
      color: var(--text-body);
      margin-bottom: 8px;
      padding-left: 18px;
      position: relative;
      line-height: 1.4;
    }

    .comp-list li::before {
      content: "•";
      color: var(--text-mocha);
      font-weight: bold;
      position: absolute;
      left: 4px;
    }

    .synergy-banner {
      background: #DDE2D8;
      border: 1px solid #CBD3C4;
      border-radius: 12px;
      padding: 16px 24px;
    }

    .synergy-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .synergy-desc {
      font-size: 0.85rem;
      color: #384234;
      line-height: 1.45;
    }

    /* Slide 5: Innovation Showcase */
    .innovation-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex: 1;
    }

    .innovation-card {
      display: flex;
      flex-direction: column;
      padding: 22px;
    }

    .innovation-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .innovation-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Slide 6: Architecture Stack */
    .arch-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      justify-content: center;
    }

    .arch-tier {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
    }

    .arch-tag {
      width: 190px;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      padding: 8px 12px;
      border-radius: 8px;
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }

    .arch-info {
      flex: 1;
    }

    .arch-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 2px;
    }

    .arch-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Slide 7: Workflow Pipeline */
    .pipeline-container {
      position: relative;
      margin-top: 30px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .pipeline-line {
      position: absolute;
      top: 24px;
      left: 5%;
      right: 5%;
      height: 2px;
      background: var(--contour-line);
      z-index: 1;
    }

    .pipeline-step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 14%;
    }

    .step-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #F8F6F2;
      border: 2px solid var(--contour-line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-dark);
      margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .step-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .step-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Slide 8: Benefits / Impact */
    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      flex: 1;
      align-items: stretch;
    }

    .benefit-card {
      display: flex;
      flex-direction: column;
      padding: 30px;
    }

    .benefit-stat {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-mocha);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .benefit-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .benefit-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Slide 9: Team Credits */
    .team-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 20px;
    }

    .developer-card {
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .developer-role {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-mocha);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .developer-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .developer-desc {
      font-size: 0.85rem;
      color: var(--text-body);
      line-height: 1.5;
    }

    .supervisor-banner {
      background: #EAE6E0;
      border: 1px solid #7D6652;
      border-radius: 14px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .supervisor-badge {
      background: #FFFFFF;
      color: var(--text-mocha);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 0.08em;
      white-space: nowrap;
      border: 1px solid #7D6652;
    }

    .supervisor-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .supervisor-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .supervisor-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .supervisor-role {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-mocha);
    }

    .supervisor-desc {
      font-size: 0.8rem;
      color: var(--text-body);
      line-height: 1.4;
    }

    /* Presentation Controls */
    .controls {

      position: fixed;
      bottom: 14px;
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 30px;
      color: #FFFFFF;
      font-size: 0.85rem;
      z-index: 100;
    }

    .control-btn {
      background: none;
      border: none;
      color: #FFFFFF;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Print / PDF Mode */
    @media print {
      body {
        background: transparent;
        height: auto;
      }
      #deck-wrapper {
        display: block;
        width: 100%;
        height: auto;
      }
      .slide-viewport {
        width: 100vw;
        height: 56.25vw;
        page-break-after: always;
        border-radius: 0;
        box-shadow: none;
        margin-bottom: 0;
      }
      .slide-content {
        display: flex !important;
        opacity: 1 !important;
      }
      .controls {
        display: none !important;
      }
    }
  </style>
</head>

    // Mount all slides
    slidesData.forEach((s, i) => {
      root.appendChild(renderSlide(s, i));
    });

    function goToSlide(n) {
      if (n < 0 || n >= slidesData.length) return;
      document.querySelectorAll('.slide-content').forEach((el, idx) => {
        if (idx === n) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
      currentSlide = n;
      indicator.textContent = `${n + 1} / ${slidesData.length}`;
    }

    document.getElementById('prev-btn').addEventListener('click', () => goToSlide(currentSlide - 1));
    document.getElementById('next-btn').addEventListener('click', () => goToSlide(currentSlide + 1));
    document.getElementById('fs-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        goToSlide(currentSlide + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        goToSlide(currentSlide - 1);
      } else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    });
