services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scholarx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarx}
      POSTGRES_USER: ${POSTGRES_USER:-scholarx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarx_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scholarx} -d ${POSTGRES_DB:-scholarx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scholarx_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: scholarx_chroma
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHROMADB_PORT:-8100}:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE

volumes:
  pgdata:
  redisdata:
  chromadata:
